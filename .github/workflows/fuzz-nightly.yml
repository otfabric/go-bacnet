name: Nightly fuzz
run-name: "Nightly fuzz (${{ github.event_name }}) on ${{ github.ref_name }}"

on:
  schedule:
    # 03:17 UTC — offset from top-of-hour to reduce shared-runner contention.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-nightly:
    name: Nightly fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseTag
            pkg: .
          - target: FuzzParseBVLC
            pkg: ./bvlc
          - target: FuzzParseAPDU
            pkg: ./apdu
          - target: FuzzParseNPDU
            pkg: ./npdu
          - target: FuzzClientReceive
            pkg: ./client
          - target: FuzzDecodeWhoIs
            pkg: ./service
          - target: FuzzDecodeIAm
            pkg: ./service
          - target: FuzzDecodeReadProperty
            pkg: ./service
          - target: FuzzDecodeWritePropertyMultiple
            pkg: ./service
          - target: FuzzDecodeWritePropertyMultipleError
            pkg: ./service
          - target: FuzzDecodeReadRange
            pkg: ./service
          - target: FuzzDecodeReadRangeACK
            pkg: ./service
          - target: FuzzDecodeLogRecords
            pkg: ./service
          - target: FuzzDecodeWhoHas
            pkg: ./service
          - target: FuzzDecodeIHave
            pkg: ./service
          - target: FuzzDecodeEventNotification
            pkg: ./service
          - target: FuzzDecodeNotificationParameters
            pkg: ./service
          - target: FuzzDecodeGetEventInformationACK
            pkg: ./service
          - target: FuzzDecodeAcknowledgeAlarm
            pkg: ./service
          - target: FuzzDecodeDeviceCommunicationControl
            pkg: ./service
          - target: FuzzDecodeReinitializeDevice
            pkg: ./service
          - target: FuzzDecodeReadPropertyMultiple
            pkg: ./service
          - target: FuzzServerReceive
            pkg: ./server
          - target: FuzzHandleBVLC
            pkg: ./bbmd
    steps:
      - name: Checkout go-bacnet
        uses: actions/checkout@v7

      # Go 1.27, not the go.mod minimum (1.26; CI tests both). Up to Go 1.26 the
      # fuzz coordinator can report "context deadline exceeded" as a failure
      # when -fuzztime expires, without any failing input: the deadline is set
      # on the parent context before the child is canceled
      # (go.dev/issue/75804, fixed in Go 1.27.0 internal/fuzz/fuzz.go).
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Fuzz ${{ matrix.target }}
        env:
          GOWORK: "off"
          FUZZTIME: 5m
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="${FUZZTIME}" ${{ matrix.pkg }}

      - name: Upload fuzz corpus / crashers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: ignore
