name: Nightly fuzz
run-name: "Nightly fuzz (${{ github.event_name }}) on ${{ github.ref_name }}"

on:
  schedule:
    # 03:17 UTC — offset from top-of-hour to reduce shared-runner contention.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fuzz matrix is discovered, not listed here: `make fuzz-list` prints
  # one "<package> <target>" line per Fuzz function in the packages of
  # FUZZ_PKGS, the same discovery `make fuzz` uses, and the fuzz job gets one
  # matrix entry per line.
  discover:
    name: Discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout go-bacnet
        uses: actions/checkout@v7

      # The same Go as the fuzz job, which compiles the same test binaries.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: List fuzz targets
        id: list
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          list="$(make -s fuzz-list)"
          printf '%s\n' "$list"
          if [ -z "$list" ]; then
            echo "make fuzz-list found no fuzz target" >&2
            exit 1
          fi
          # Every line is "<package> <FuzzName>".
          if grep -Evq '^[^ ]+ Fuzz[A-Za-z0-9_]*$' <<<"$list"; then
            echo "make fuzz-list printed a line that is not '<package> <FuzzName>'" >&2
            exit 1
          fi
          # Job and artifact names carry the target name only.
          dup="$(awk '{ print $2 }' <<<"$list" | sort | uniq -d)"
          if [ -n "$dup" ]; then
            echo "fuzz target names used in more than one package: $dup" >&2
            exit 1
          fi
          matrix="$(jq -Rnc '[inputs | split(" ") | {target: .[1], pkg: .[0]}]' <<<"$list")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Fuzz targets discovered: $(jq length <<<"$matrix")" >> "$GITHUB_STEP_SUMMARY"

  fuzz-nightly:
    name: Nightly fuzz (${{ matrix.target }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout go-bacnet
        uses: actions/checkout@v7

      # Go 1.27, not the go.mod minimum (1.26; CI tests both). Up to Go 1.26 the
      # fuzz coordinator can report "context deadline exceeded" as a failure
      # when -fuzztime expires, without any failing input: the deadline is set
      # on the parent context before the child is canceled
      # (go.dev/issue/75804, fixed in Go 1.27.0 internal/fuzz/fuzz.go).
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Fuzz ${{ matrix.target }}
        env:
          GOWORK: "off"
          FUZZTIME: 5m
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz="^${FUZZ_TARGET}\$" -fuzztime="${FUZZTIME}" "${FUZZ_PKG}"

      - name: Upload fuzz corpus / crashers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: ignore

  # Platform width (otfabric/engineering standards/testing.md#platform-width):
  # the codecs and the capture reader convert wire integers to int, so the
  # tests also run where int has 32 bits. ubuntu runners execute 386 binaries;
  # the race detector does not exist for 386.
  test-386:
    name: Tests (GOARCH=386)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout go-bacnet
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests on a 32-bit architecture
        env:
          GOWORK: "off"
        run: GOARCH=386 go test -count=1 ./...
