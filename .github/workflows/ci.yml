# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      coverage-min: "90"
      # Attribute coverage across packages, as `make coverage` does: the
      # server's objects are exercised by the server and e2e tests. Same
      # list as COVER_GATE_PKGS in the Makefile (examples, interop, e2e and
      # the test helpers internal/fixtures and internal/leak are excluded).
      coverpkg: >-
        github.com/otfabric/go-bacnet,github.com/otfabric/go-bacnet/apdu,github.com/otfabric/go-bacnet/bbmd,github.com/otfabric/go-bacnet/bip,github.com/otfabric/go-bacnet/bvlc,github.com/otfabric/go-bacnet/client,github.com/otfabric/go-bacnet/device,github.com/otfabric/go-bacnet/internal/clock,github.com/otfabric/go-bacnet/internal/diag,github.com/otfabric/go-bacnet/internal/faulty,github.com/otfabric/go-bacnet/internal/imports,github.com/otfabric/go-bacnet/internal/link,github.com/otfabric/go-bacnet/internal/segment,github.com/otfabric/go-bacnet/internal/virtual,github.com/otfabric/go-bacnet/npdu,github.com/otfabric/go-bacnet/server,github.com/otfabric/go-bacnet/server/object,github.com/otfabric/go-bacnet/service
      fuzz-time: 10s
      codecov-name: go-bacnet
      go-versions: '["1.26", "1.27"]'
    secrets: inherit

  # Hermetic library coverage gates (COVERAGE_MIN, COVER_PKG_MIN per package).
  library-coverage:
    name: Library coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout go-bacnet
        uses: actions/checkout@v7

      - name: Load bacnet-interop pin
        id: pin
        run: |
          set -euo pipefail
          pin=interop/bacnet-interop-pin.json
          test -f "$pin"
          echo "ref=$(jq -r .ref "$pin")" >> "$GITHUB_OUTPUT"

      - name: Checkout bacnet-interop (pinned fixtures)
        uses: actions/checkout@v7
        with:
          repository: otfabric/bacnet-interop
          ref: ${{ steps.pin.outputs.ref }}
          path: bacnet-interop

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Library coverage gate
        env:
          BACNET_INTEROP_ROOT: ${{ github.workspace }}/bacnet-interop
          BACNET_INTEROP_REQUIRED: "1"
          GOWORK: "off"
        run: make coverage coverage-pkg-check

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 30
          if-no-files-found: ignore
